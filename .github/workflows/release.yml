name: Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm Trusted Publishing: the OIDC token is exchanged with the registry
      # for a short-lived publish credential.
      id-token: write
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    # Deliberately no `registry-url`: it writes an .npmrc containing an authToken placeholder, which
    # gets in the way of the OIDC exchange in the publish step below.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Trusted publishing needs npm >= 11.5.1, which ships with Node 24. Node 20 carries npm 10.
        node-version: '24.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and test
      run: |
        pnpm generate
        pnpm tsc --noEmit

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Determine version bump
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
        else
          # Auto-determine version bump based on commit messages
          if git log --format=%B -n 1 | grep -q "BREAKING CHANGE\|breaking change"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif git log --format=%B -n 1 | grep -qE "^feat(\(.+\))?\!?:|^feature(\(.+\))?\!?:"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Bump version
      id: bump
      run: |
        OLD_VERSION=$(node -p "require('./package.json').version")
        npm version ${{ steps.version.outputs.type }} --no-git-tag-version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    # Everything from here to the publish step is local to the runner. Nothing is pushed, tagged or
    # announced until npm has accepted the package, so a failure past this point leaves no trace
    # outside the run. This is the ordering semantic-release uses, and reversing it is what produced
    # a v1.0.2 tag and GitHub Release with no v1.0.2 on npm.
    - name: Build the publishable package
      run: ./package.sh

    - name: Verify the tarball a consumer would install
      run: pnpm test:package

    # No npm token: the package is configured for Trusted Publishing with tokens disallowed, so auth is
    # the OIDC exchange alone. `pnpm publish` shells out to the npm CLI on PATH (npm 11 from Node 24),
    # which performs the exchange. No `env:` block here on purpose: an `env:` key with nothing under it
    # is a workflow syntax error that stops the entire file from loading.
    - name: Publish to NPM
      run: |
        cd package
        pnpm publish --access public --no-git-checks

    # npm has the version now, so the tag and the release can point at something installable.
    - name: Commit and tag the published version
      run: |
        git add package.json
        git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
        git tag "v${{ steps.bump.outputs.new_version }}"

    - name: Push changes
      run: |
        git push origin master
        git push origin "v${{ steps.bump.outputs.new_version }}"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.bump.outputs.new_version }}" \
          --title "Release v${{ steps.bump.outputs.new_version }}" \
          --notes "## Changes

        See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes.

        **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.bump.outputs.old_version }}...v${{ steps.bump.outputs.new_version }}"

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: published-package-v${{ steps.bump.outputs.new_version }}
        path: package/
        retention-days: 30
