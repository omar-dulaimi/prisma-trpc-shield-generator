name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 24 is the Node the release job publishes from, so it has to be one of the versions CI
        # actually exercises. 20 is end-of-life and the runners now force actions off it anyway.
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build project
      run: pnpm generate

    # There is deliberately no lint step. There is no linter in this repo, and the step that used
    # to sit here ran `pnpm lint || echo "Linting skipped"` under `continue-on-error`. With no lint
    # script defined, `pnpm lint` exits 254, the `||` swallowed it and `continue-on-error` swallowed
    # anything the `||` missed, so the step reported success on every run it had ever made. It
    # advertised coverage the repo did not have. `tsc --noEmit` above is the real static gate.
    - name: Run type checking
      run: pnpm tsc --noEmit

    - name: Run tests
      run: pnpm test

  package-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Matches the release job, so the tarball is verified on the Node it is published from.
        node-version: '24.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # This used to run `pnpm package:publish`, a script that ended in `pnpm publish`, so the job
    # attempted a real publish on every pull request, fell back to a bare `./package.sh` when the
    # publish failed for lack of auth, and then "verified" the empty package that fallback produced.
    # That script is gone: no script in this repo can publish, only release.yml can.
    - name: Build and package
      run: |
        pnpm generate
        ./package.sh

    # Packs the tarball, installs it into an empty directory and drives the installed binary, which
    # is the only thing here that can see a package that builds but ships no code.
    - name: Test package integrity
      run: pnpm test:package

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-build
        path: package/
        retention-days: 7
